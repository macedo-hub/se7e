<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitar Troca/Devolução — SE7E</title>
  <link rel="icon" type="image/svg+xml" href="../img/logo-hexagono.svg">
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/estilo.css" />
</head>
<body>

  <header class="cabecalho">
    <div class="recipiente barra-cabecalho">
      <a href="../index.html" class="marca">
        <svg class="marca-hexagono" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="gradeHexTroca" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5c86e8"/><stop offset="1" stop-color="#1c3a75"/></linearGradient></defs>
          <path d="M20 3 34.5 11.5 34.5 28.5 20 37 5.5 28.5 5.5 11.5Z" fill="url(#gradeHexTroca)"/>
        </svg>
        SE7E
      </a>
      <button class="botao-menu-movel" aria-label="Abrir menu">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg>
      </button>
      <nav class="nav-principal" aria-label="Navegação principal">
        <a href="../index.html">Início</a>
        <a href="../index.html#destaques">Produtos</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
      </nav>
      <div class="acoes-cabecalho">
        <button class="botao-icone" aria-label="Buscar">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        </button>
        <a href="login.html" class="botao-icone" aria-label="Minha conta">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </a>
        <a href="carrinho.html" class="botao-icone" aria-label="Carrinho de compras">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg>
          <span class="contador-carrinho">0</span>
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="recipiente secao mais-estreito">
      <a href="pedido.html" class="link-voltar mb-1">
        <svg class="icone icone-pequeno" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Voltar
      </a>
      <h1 class="mb-3">Solicitar Troca/Devolução</h1>

      <button type="button" class="opcao-solicitacao" data-abre="form-troca">
        <span class="icone-opcao">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </span>
        <div>
          <h3>Troca de produto</h3>
          <p>Você pode solicitar uma troca até 7 dias após o recebimento.</p>
        </div>
        <svg class="icone icone-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <form class="formulario-solicitacao" id="form-troca">
        <div class="campo">
          <label for="pedido-troca">Pedido</label>
          <select id="pedido-troca">
            <option>#SE7E12345 — Moletom Oversized</option>
          </select>
        </div>
        <div class="campo">
          <label for="motivo-troca">Motivo da solicitação</label>
          <textarea id="motivo-troca" rows="3" placeholder="Conte o que aconteceu com o produto" required></textarea>
        </div>
        <button type="submit" class="botao botao-primario botao-bloco">Enviar solicitação de troca</button>
      </form>

      <button type="button" class="opcao-solicitacao" data-abre="form-devolucao">
        <span class="icone-opcao">
          <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
        </span>
        <div>
          <h3>Devolução e reembolso</h3>
          <p>Solicite a devolução e receba o reembolso do valor pago.</p>
        </div>
        <svg class="icone icone-seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </button>

      <form class="formulario-solicitacao" id="form-devolucao">
        <div class="campo">
          <label for="pedido-devolucao">Pedido</label>
          <select id="pedido-devolucao">
            <option>#SE7E12345 — Moletom Oversized</option>
          </select>
        </div>
        <div class="campo">
          <label for="motivo-devolucao">Motivo da solicitação</label>
          <textarea id="motivo-devolucao" rows="3" placeholder="Conte o motivo da devolução" required></textarea>
        </div>
        <button type="submit" class="botao botao-primario botao-bloco">Enviar solicitação de devolução</button>
      </form>

      <div class="aviso-caixa mt-2">
        <svg class="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <span>O produto deve estar na embalagem original, sem sinais de uso e com a etiqueta.</span>
      </div>
    </div>
  </main>

  <script src="../js/produtos.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
